<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#09111e"><title>NEON RUN 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09111e;color:white;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.stat,button{border:1px solid #ffffff35;background:#0b1728dc;color:white;border-radius:14px;padding:10px 14px;font-weight:900}.stat small{display:block;color:#a8bbce;font-size:9px;letter-spacing:2px}.stat b{font-size:20px}#pause{pointer-events:auto;font-size:18px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#06101dbb;backdrop-filter:blur(6px)}.panel{width:min(90vw,390px);padding:28px 22px;text-align:center;border-radius:24px;border:1px solid #ffffff35;background:linear-gradient(145deg,#1b3048f5,#0b1424f5);box-shadow:0 20px 70px #0009}h1{font-size:48px;line-height:.9;margin:12px 0;letter-spacing:-2px}p{color:#c1cfdd;line-height:1.5}#start{width:100%;padding:16px;background:#d8ff62;color:#101820;border:0;font-size:15px;letter-spacing:1px}#touch{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.group{display:flex;gap:8px}.move{pointer-events:auto;width:56px;height:56px;font-size:22px;background:#10243bdc}
</style></head><body><div id="game"></div><div class="hud"><div class="stat"><small>DISTÂNCIA</small><b id="meters">0 m</b></div><div class="stat"><small>MOEDAS</small><b id="coins">0</b></div><button id="pause">Ⅱ</button></div><div id="touch"><div class="group"><button class="move" data-a="left">‹</button><button class="move" data-a="right">›</button></div><div class="group"><button class="move" data-a="jump">↑</button><button class="move" data-a="duck">↓</button></div></div><div id="overlay"><div class="panel"><div style="font-size:10px;letter-spacing:3px;color:#b8e5ff;font-weight:900">CORRIDA INFINITA 3D</div><h1 id="title">NEON<br>RUN</h1><p id="desc">Desvie dos trens, salte barreiras e colete moedas nos trilhos da cidade.</p><button id="start">COMEÇAR</button><p style="font-size:11px;color:#91a5bd">DESLIZE NA TELA • SETAS • PULAR E ABAIXAR</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x8ab5ca);scene.fog=new THREE.Fog(0x8ab5ca,35,115);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);camera.position.set(0,5,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf3ff,0x35404a,2));const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-7,14,7);sun.castShadow=true;scene.add(sun);
const M=(c,r=.7,m=0,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...extra});
function surfaceTexture(base,kind='rough'){
  const cv=document.createElement('canvas');cv.width=cv.height=256;const ctx=cv.getContext('2d');
  ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
  const img=ctx.getImageData(0,0,256,256),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*(kind==='asphalt'?38:kind==='metal'?18:28);d[i]=Math.max(0,Math.min(255,d[i]+n));d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));}
  ctx.putImageData(img,0,0);
  if(kind==='asphalt'){for(let i=0;i<950;i++){ctx.fillStyle=Math.random()>.5?'#11182055':'#c4cbd022';ctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*2)}}
  if(kind==='concrete'){for(let i=0;i<38;i++){ctx.strokeStyle='#202a3340';ctx.lineWidth=1;ctx.beginPath();let x=Math.random()*256,y=Math.random()*256;ctx.moveTo(x,y);ctx.lineTo(x+(Math.random()-.5)*30,y+Math.random()*35);ctx.stroke()}}
  if(kind==='metal'){for(let y=12;y<256;y+=32){ctx.fillStyle='#dce8ed22';ctx.fillRect(0,y,256,2);ctx.fillStyle='#10182055';ctx.fillRect(0,y+3,256,2)}}
  if(kind==='paint'){for(let y=0;y<256;y+=64){ctx.fillStyle='#ffffff18';ctx.fillRect(0,y,256,3);ctx.fillStyle='#07152230';ctx.fillRect(0,y+4,256,2)}}
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=4;return tex;
}
const asphalt=M(0xffffff,.96,0,{map:surfaceTexture('#303b47','asphalt')}),
steel=M(0xffffff,.28,.82,{map:surfaceTexture('#9eabb3','metal')}),
wood=M(0xffffff,.9,0,{map:surfaceTexture('#51483e','rough')}),
blue=M(0xffffff,.38,.25,{map:surfaceTexture('#176d91','paint')}),
glass=M(0x18384d,.2,.4),yellow=M(0xffd34e),red=M(0xd65a50),dark=M(0x172333),skin=M(0xd69a72),cloth=M(0x36a9a6),pants=M(0x273d59),gold=M(0xffcf43,.3,.5);
const facadeMats=[0x657f91,0x8c8175,0x536b7d,0x9b9a8c].map(col=>M(col,.92,0,{map:surfaceTexture('#a0a0a0','concrete')}));
function cube(w,h,d,mat,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(r,h,mat,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),mat);o.position.set(x,y,z);parent.add(o);return o}
cube(80,.3,220,asphalt,0,-.25,-80);for(let l=-1;l<=1;l++){cube(.12,.12,210,steel,l*2.25-.4,.02,-80);cube(.12,.12,210,steel,l*2.25+.4,.02,-80)}
let sleepers=[];for(let i=0;i<48;i++)sleepers.push(cube(7,.15,.35,wood,0,-.03,-i*3.6));
let buildings=[];for(let s of [-1,1])for(let i=0;i<18;i++){let h=8+Math.random()*18,w=4+Math.random()*4,x=s*(8+Math.random()*5),z=-i*9-5;let b=cube(w,h,7,facadeMats[i%4],x,h/2,z);buildings.push(b);for(let y=2;y<h-1;y+=2.7)for(let xx=-w/2+.7;xx<w/2-.4;xx+=1.4)cube(.65,.85,.05,glass,x+xx,y,z-3.53)}
let runner=new THREE.Group();scene.add(runner);runner.position.set(0,0,2);
cube(.76,1,.4,cloth,0,1.3,0,runner);let head=new THREE.Mesh(new THREE.SphereGeometry(.3,18,14),skin);head.position.y=2.05;runner.add(head);cube(.45,.58,.2,yellow,0,1.35,-.3,runner);let legs=[],arms=[];for(let s of [-1,1]){let leg=new THREE.Group();leg.position.set(s*.2,.82,0);runner.add(leg);cube(.22,.75,.23,pants,0,-.35,0,leg);cube(.28,.15,.4,dark,0,-.74,.08,leg);legs.push(leg);let arm=new THREE.Group();arm.position.set(s*.47,1.65,0);runner.add(arm);cube(.17,.65,.18,cloth,0,-.3,0,arm);arms.push(arm)}
let items=[],lane=0,y=0,vy=0,duck=0,started=false,paused=false,meters=0,coinCount=0,clock=new THREE.Clock(),spawn=0,t=0;
function coin(l,z){let g=new THREE.Group(),o=new THREE.Mesh(new THREE.TorusGeometry(.31,.085,10,22),yellow);o.rotation.y=Math.PI/2;g.add(o);g.position.set(l*2.25,1.2,z);scene.add(g);items.push({g,type:'coin',l})}
function barrier(l,z){let g=new THREE.Group();cube(1.5,.8,.5,red,0,.42,0,g);cube(1.65,.16,.6,yellow,0,.65,0,g);g.position.set(l*2.25,0,z);scene.add(g);items.push({g,type:'barrier',l})}
function train(l,z){let g=new THREE.Group();cube(3.7,2.8,8,blue,0,1.5,0,g);cube(3.4,.18,7.8,steel,0,2.95,0,g);for(let z0 of [-2.7,0,2.7])cube(1,.85,.08,glass,0,2.05,z0,g);g.position.set(l*2.25,0,z);scene.add(g);items.push({g,type:'train',l})}
function spawnItems(){let l=Math.floor(Math.random()*3)-1,r=Math.random(),z=-76;if(r<.43){for(let i=0;i<5;i++)coin(l,z-i*2.1)}else if(r<.73)barrier(l,z);else train(l,z)}
function act(a){if(!started||paused)return;if(a==='left')lane=Math.max(-1,lane-1);if(a==='right')lane=Math.min(1,lane+1);if(a==='jump'&&y===0&&duck===0)vy=8.5;if(a==='duck'&&y<.1)duck=.7}
function overlay(title,desc,btn){document.querySelector('#title').innerHTML=title;document.querySelector('#desc').textContent=desc;document.querySelector('#start').textContent=btn;document.querySelector('#overlay').style.display='grid'}
function begin(){items.forEach(o=>scene.remove(o.g));items=[];lane=0;y=0;vy=0;duck=0;meters=0;coinCount=0;spawn=.5;started=true;paused=false;document.querySelector('#overlay').style.display='none';document.querySelector('#pause').textContent='Ⅱ'}
function finish(){started=false;overlay('FIM<br>DE JOGO','Você percorreu '+Math.floor(meters)+' metros e pegou '+coinCount+' moedas.','JOGAR NOVAMENTE')}
document.querySelector('#start').onclick=()=>{if(paused){paused=false;started=true;document.querySelector('#overlay').style.display='none'}else begin()};
document.querySelector('#pause').onclick=()=>{if(!started&&!paused)return;paused=!paused;if(paused){started=false;overlay('PAUSADO','Sua corrida está pausada.','CONTINUAR')}else{started=true;document.querySelector('#overlay').style.display='none'}};
document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();act(b.dataset.a)});
let sx=0,sy=0;renderer.domElement.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};renderer.domElement.onpointerup=e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');else act(dy<0?'jump':'duck')};
onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')act('left');if(e.key==='ArrowRight'||e.key==='d')act('right');if(e.key==='ArrowUp'||e.key===' ')act('jump');if(e.key==='ArrowDown'||e.key==='s')act('duck')};
function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04);if(started&&!paused){t+=dt;let speed=22+Math.min(12,meters*.015);meters+=dt*speed/3;spawn-=dt;if(spawn<=0){spawnItems();spawn=.95+Math.random()*.25}
if(vy!==0||y>0){vy-=21*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0}if(duck>0)duck=Math.max(0,duck-dt);
runner.position.x=THREE.MathUtils.damp(runner.position.x,lane*2.25,12,dt);runner.position.y=y;runner.scale.y=duck>0?.6:1;legs[0].rotation.x=Math.sin(t*13)*.75;legs[1].rotation.x=-legs[0].rotation.x;arms[0].rotation.x=-legs[0].rotation.x*.7;arms[1].rotation.x=-arms[0].rotation.x;
for(let o of items){o.g.position.z+=speed*dt;if(o.type==='coin')o.g.rotation.z+=dt*3;if(o.g.position.z>-.8&&o.g.position.z<1&&o.l===lane){if(o.type==='coin'){coinCount++;o.g.position.z=20;o.hit=true}else if(o.type==='train'||(o.type==='barrier'&&y<1.05&&duck===0)){finish();break}}}
items=items.filter(o=>{if(o.hit||o.g.position.z>12){scene.remove(o.g);return false}return true});
for(let o of sleepers){o.position.z+=speed*dt;if(o.position.z>7)o.position.z-=173}for(let o of buildings){o.position.z+=speed*dt;if(o.position.z>14)o.position.z-=162}
camera.position.x=THREE.MathUtils.damp(camera.position.x,runner.position.x*.16,3,dt);camera.lookAt(runner.position.x*.1,1.2,-7);document.querySelector('#meters').textContent=Math.floor(meters)+' m';document.querySelector('#coins').textContent=coinCount}
renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});overlay('NEON<br>RUN','Desvie dos trens, salte barreiras e colete moedas nos trilhos da cidade.','COMEÇAR');frame();
</script></body></html>
